<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths PlayLand</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">🌈 Maths PlayLand</div>
    <button id="homeBtn">🏠 Home</button>
</header>

<main>

    <!-- HOME -->
    <section id="home" class="screen active">
        <div class="hero">
            <div class="hero-girl">👧</div>

            <div>
                <h1>Maths PlayLand 🎮</h1>
                <p>Learn Maths by touching, moving and playing!</p>

                <button class="big-btn" id="startBtn">
                    🚀 Start Playing
                </button>
            </div>
        </div>

        <div class="features">
            <div>👆<br><b>Touch</b></div>
            <div>🤏<br><b>Drag</b></div>
            <div>🏃<br><b>Move</b></div>
            <div>🎉<br><b>Have Fun</b></div>
        </div>
    </section>


    <!-- ACTIVITIES -->
    <section id="activities" class="screen">

        <h2>🎮 Choose Your Maths Game</h2>
        <p class="subtitle">Come to the board and play!</p>

        <div class="games">

            <button class="game-card" data-game="addition">
                🍫
                <b>Chocolate Collector</b>
                <small>Addition</small>
            </button>

            <button class="game-card" data-game="subtraction">
                🎈
                <b>Balloon Pop</b>
                <small>Subtraction</small>
            </button>

            <button class="game-card" data-game="multiplication">
                📦
                <b>Equal Groups</b>
                <small>Multiplication</small>
            </button>

            <button class="game-card" data-game="division">
                🍬
                <b>Fair Sharing</b>
                <small>Division</small>
            </button>

            <button class="game-card" data-game="numberline">
                🚶
                <b>Number Line</b>
                <small>Numbers</small>
            </button>

            <button class="game-card" data-game="fishing">
                🎣
                <b>Number Fishing</b>
                <small>Counting</small>
            </button>

            <button class="game-card" data-game="pattern">
                🚂
                <b>Pattern Train</b>
                <small>Patterns</small>
            </button>

            <button class="game-card" data-game="sorting">
                🧺
                <b>Sort Objects</b>
                <small>Thinking</small>
            </button>

            <button class="game-card" data-game="blocks">
                🧱
                <b>Build a Number</b>
                <small>Counting</small>
            </button>

        </div>
    </section>


    <!-- GAME -->
    <section id="game" class="screen">

        <div class="game-top">

            <button id="backBtn">← Games</button>

            <h2 id="gameTitle">Maths Game</h2>

            <div class="score">
                ⭐ <span id="score">0</span>
            </div>

        </div>

        <div id="instruction" class="instruction">
            Let's play!
        </div>

        <div id="gameArea" class="game-area"></div>

        <div id="message" class="message"></div>

    </section>

</main>


<!-- SUCCESS POPUP -->

<div id="success" class="popup">

    <div class="popup-box">

        <div class="big-emoji">🎉</div>

        <h2 id="successText">Amazing!</h2>

        <button id="continueBtn">
            Continue 🚀
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
